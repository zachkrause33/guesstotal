name: Update Bundles

on:
  schedule:
    - cron: '0 6 * * *'  # 6 AM UTC daily (1 AM CT / 2 AM ET)
  workflow_dispatch:
    inputs:
      rainforest_api_key:
        description: 'Rainforest API key (leave blank if already saved as secret)'
        required: false
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Refresh prices and images
        env:
          RAINFOREST_API_KEY: ${{ secrets.RAINFOREST_API_KEY || inputs.rainforest_api_key }}
          AMAZON_PARTNER_TAG: guesstotal-20
        if: env.RAINFOREST_API_KEY != ''
        run: npm run refresh-prices

      - name: Generate bundles
        env:
          RAINFOREST_API_KEY: ${{ secrets.RAINFOREST_API_KEY || inputs.rainforest_api_key }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run generate

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products.pool.json public/bundles.json public/bundles.meta.json public/scrape-cache.json public/images/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update bundles $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi

  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Run weekly on Sundays to find new products
    if: github.event.schedule == '0 6 * * 0' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Discover new products
        env:
          RAINFOREST_API_KEY: ${{ secrets.RAINFOREST_API_KEY || inputs.rainforest_api_key }}
          AMAZON_PARTNER_TAG: guesstotal-20
        if: env.RAINFOREST_API_KEY != ''
        run: npm run discover

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products.pool.json public/scrape-cache.json public/images/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Discover new products $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
